name: Keepalive

# GitHub auto-disables `schedule:` workflows in a PUBLIC repo after 60 days
# without repository activity - and a scheduled workflow's own runs do NOT count
# as activity. This repo may legitimately go quiet (upstream stops building, or
# you switch to a rolling tag so state.json stops changing), so once a month we
# make a trivial commit to reset that clock.
#
# Note: commits authored via GITHUB_TOKEN are excluded from *event triggers*
# (so this cannot start a loop), but they are still repository activity for the
# inactivity timer.

on:
  schedule:
    - cron: '37 4 1,17 * *'   # 04:37 UTC on the 1st and the 17th
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Touch the marker
        run: date -u +%FT%TZ > .keepalive

      - name: Commit only if it changed
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
          fi
